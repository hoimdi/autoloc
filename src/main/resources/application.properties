spring.application.name=autoloc-api
# Connexion à la base de données
server.port=9091
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA / pour create drop j'ai utilise parceque je suis en corus de faire la bd mais je suis pas sur pour otu les bd et je peux ajouter et suprimer
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO 